[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-ingest"
version = "0.2.0"
description = "Deterministic Markdown-to-Atlas knowledge compiler"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
atlas-ingest = "atlas_ingest.cli:main"

[tool.setuptools]
packages = ["atlas_ingest"]
