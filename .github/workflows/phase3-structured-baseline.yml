name: Phase 3 Structured Baseline

on:
  push:
    branches: [main]
    paths:
      - "content/canonical/**"
      - "content/fixtures/phase3_retrieval/**"
      - "docs/phase-3/**"
      - "tools/phase3_retrieval/**"
      - ".github/workflows/phase3-structured-baseline.yml"
  pull_request:
    paths:
      - "content/canonical/**"
      - "content/fixtures/phase3_retrieval/**"
      - "docs/phase-3/**"
      - "tools/phase3_retrieval/**"
      - ".github/workflows/phase3-structured-baseline.yml"

permissions:
  contents: read

jobs:
  structured-baseline:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/foundation-validator/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r tools/foundation-validator/requirements.txt

      - name: Run structured baseline tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tools.phase3_retrieval.tests.test_structured -v 2>&1 | tee phase3-structured-tests.txt

      - name: Generate structured index, results, metrics, and report
        run: |
          python -m tools.phase3_retrieval.structured \
            --query-set content/fixtures/phase3_retrieval/reference-query-set.v01.json \
            --lexical-baseline content/fixtures/phase3_retrieval/lexical-baseline.json \
            --cutoff 5 \
            --limit 10 \
            --index-output phase3-structured-index.json \
            --result-output phase3-structured-results.json \
            --metric-output phase3-structured-metrics.json \
            --report-output phase3-structured-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          index = json.loads(Path('phase3-structured-index.json').read_text(encoding='utf-8'))
          metrics = json.loads(Path('phase3-structured-metrics.json').read_text(encoding='utf-8'))
          report = json.loads(Path('phase3-structured-report.json').read_text(encoding='utf-8'))
          assert index['contract'] == 'atlas-structured-index/0.1'
          assert index['field_policy']['canonical_body_indexed'] is False
          assert index['replaceable'] is True
          assert index['live'] is False
          assert report['accepted_judgments_unchanged'] is True
          assert report['external_services'] is False
          assert report['embeddings'] is False
          assert report['vector_database'] is False
          assert report['judgment_specific_tuning'] is False
          print('structured-build-digest=' + index['build_digest'])
          print('structured-result-set-sha256=' + metrics['result_set_sha256'])
          print('structured-tie-count=' + str(metrics['tie_count']))
          print('structured-metrics=' + json.dumps(metrics['metrics'], sort_keys=True, separators=(',', ':')))
          print('structured-delta=' + json.dumps(report['metric_delta_from_lexical'], sort_keys=True, separators=(',', ':')))
          print('phase3-structured=candidate; entities=34; queries=13; cutoff=5; body=false; replaceable=true; embeddings=false; live=false')
          PY

      - name: Upload structured baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-structured-baseline-python-${{ matrix.python-version }}
          path: |
            phase3-structured-tests.txt
            phase3-structured-index.json
            phase3-structured-results.json
            phase3-structured-metrics.json
            phase3-structured-report.json
          if-no-files-found: error
          retention-days: 30
