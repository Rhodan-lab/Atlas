name: Phase 3 Research Foundations

on:
  push:
    branches: [main]
    paths:
      - "content/canonical/**"
      - "content/fixtures/phase3_retrieval/**"
      - "docs/phase-3/**"
      - "tools/phase3_retrieval/**"
      - ".github/workflows/phase3-research-foundations.yml"
  pull_request:
    paths:
      - "content/canonical/**"
      - "content/fixtures/phase3_retrieval/**"
      - "docs/phase-3/**"
      - "tools/phase3_retrieval/**"
      - ".github/workflows/phase3-research-foundations.yml"

permissions:
  contents: read

jobs:
  research-foundations:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/foundation-validator/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r tools/foundation-validator/requirements.txt

      - name: Run research-foundation tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tools.phase3_retrieval.tests.test_research -v 2>&1 | tee phase3-research-foundations-tests.txt

      - name: Generate research-foundation evidence
        run: |
          python -m tools.phase3_retrieval.research \
            --query-set content/fixtures/phase3_retrieval/reference-query-set.v01.json \
            --structured-baseline content/fixtures/phase3_retrieval/structured-baseline.json \
            --fixtures content/fixtures/phase3_retrieval/research-foundations.v01.json \
            --report-output phase3-research-foundations-report.json \
            --filter-results-output phase3-filter-results.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('phase3-research-foundations-report.json').read_text(encoding='utf-8'))
          results = json.loads(Path('phase3-filter-results.json').read_text(encoding='utf-8'))
          assert report['contract'] == 'atlas-phase3-research-foundation-report/0.1'
          assert report['decision'] == 'research-foundation-candidate'
          assert report['entity_count'] == 34
          assert report['counts']['filters'] == 4
          assert report['counts']['trails'] == 1
          assert report['counts']['contradiction_candidates'] == 1
          assert report['counts']['duplicate_candidates'] == 1
          assert report['counts']['negative_cases'] == 5
          assert len(results) == 4
          assert report['exact_revision_preserved'] is True
          assert report['provenance_visible'] is True
          assert report['review_and_staleness_visible'] is True
          assert report['candidate_authority'] == 'advisory-only'
          assert report['automatic_merge_or_resolution'] is False
          assert report['canonical_copy_authority'] is False
          assert report['embeddings'] is False
          assert report['vector_database'] is False
          assert report['external_services'] is False
          assert report['live'] is False
          assert report['repository_mutation'] is False
          print('research-foundation-report-digest=' + report['report_digest'])
          print('research-foundation-counts=' + json.dumps(report['counts'], sort_keys=True, separators=(',', ':')))
          print('filter-result-digests=' + json.dumps(report['filter_result_digests'], separators=(',', ':')))
          print('phase3-research-foundations=candidate; filters=4; trails=1; contradiction=1; duplicate=1; negatives=5; embeddings=false; live=false')
          PY

      - name: Upload research-foundation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-research-foundations-python-${{ matrix.python-version }}
          path: |
            phase3-research-foundations-tests.txt
            phase3-research-foundations-report.json
            phase3-filter-results.json
          if-no-files-found: error
          retention-days: 30
