name: Foundation Contract

on:
  push:
    branches: [main]
    paths:
      - "content/canonical/**"
      - "content/translations/**"
      - "content/fixtures/**"
      - "docs/foundation/**"
      - "docs/adr/0001-phase-0-validator-baseline.md"
      - "tools/foundation-validator/**"
      - ".github/workflows/foundation.yml"
  pull_request:
    paths:
      - "content/canonical/**"
      - "content/translations/**"
      - "content/fixtures/**"
      - "docs/foundation/**"
      - "docs/adr/0001-phase-0-validator-baseline.md"
      - "tools/foundation-validator/**"
      - ".github/workflows/foundation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/foundation-validator/requirements.txt

      - name: Install pinned validator dependency
        run: python -m pip install -r tools/foundation-validator/requirements.txt

      - name: Initialize validation log
        run: : > foundation-validation.log

      - name: Run validator contract tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tools/foundation-validator/tests -v 2>&1 \
            | tee -a foundation-validation.log

      - name: Validate canonical and translated content
        shell: bash
        run: |
          set -o pipefail
          python tools/foundation-validator/atlas_foundation_validator.py validate \
            content/canonical content/translations 2>&1 \
            | tee -a foundation-validation.log

      - name: Validate migration fixtures
        shell: bash
        run: |
          set -o pipefail
          python tools/foundation-validator/atlas_foundation_validator.py migration \
            content/fixtures/migrations/mechanical-0.1-to-0.2.json 2>&1 \
            | tee -a foundation-validation.log
          python tools/foundation-validator/atlas_foundation_validator.py migration \
            content/fixtures/migrations/semantic-claim-split.json 2>&1 \
            | tee -a foundation-validation.log

      - name: Validate identity fixture
        shell: bash
        run: |
          set -o pipefail
          python tools/foundation-validator/atlas_foundation_validator.py identity \
            content/fixtures/identity/alias-rename-federation.json 2>&1 \
            | tee -a foundation-validation.log

      - name: Verify stale translation state
        shell: bash
        run: |
          set -o pipefail
          state="$(python tools/foundation-validator/atlas_foundation_validator.py translation-staleness \
            content/fixtures/translation/stale-source-revision.json)"
          printf 'translation-staleness=%s\n' "$state" | tee -a foundation-validation.log
          test "$state" = "possibly-stale"

      - name: Upload full validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-validation-python-${{ matrix.python-version }}
          path: foundation-validation.log
          if-no-files-found: error
          retention-days: 14
