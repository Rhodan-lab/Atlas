name: Foundation Contract

on:
  push:
    branches: [main]
    paths:
      - "content/canonical/**"
      - "content/translations/**"
      - "content/fixtures/**"
      - "docs/foundation/**"
      - "docs/adr/0001-phase-0-validator-baseline.md"
      - "tools/foundation-validator/**"
      - ".github/workflows/foundation.yml"
  pull_request:
    paths:
      - "content/canonical/**"
      - "content/translations/**"
      - "content/fixtures/**"
      - "docs/foundation/**"
      - "docs/adr/0001-phase-0-validator-baseline.md"
      - "tools/foundation-validator/**"
      - ".github/workflows/foundation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/foundation-validator/requirements.txt

      - name: Install pinned validator dependency
        run: python -m pip install -r tools/foundation-validator/requirements.txt

      - name: Run validator contract tests
        run: python -m unittest discover -s tools/foundation-validator/tests -v

      - name: Validate canonical and translated content
        run: |
          python tools/foundation-validator/atlas_foundation_validator.py validate \
            content/canonical content/translations

      - name: Validate migration fixtures
        run: |
          python tools/foundation-validator/atlas_foundation_validator.py migration \
            content/fixtures/migrations/mechanical-0.1-to-0.2.json
          python tools/foundation-validator/atlas_foundation_validator.py migration \
            content/fixtures/migrations/semantic-claim-split.json

      - name: Validate identity fixture
        run: |
          python tools/foundation-validator/atlas_foundation_validator.py identity \
            content/fixtures/identity/alias-rename-federation.json

      - name: Verify stale translation state
        run: |
          state="$(python tools/foundation-validator/atlas_foundation_validator.py translation-staleness \
            content/fixtures/translation/stale-source-revision.json)"
          test "$state" = "possibly-stale"
