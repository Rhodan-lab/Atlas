name: Foundation Contract

on:
  push:
    branches: [main]
    paths:
      - "content/canonical/**"
      - "content/translations/**"
      - "content/fixtures/**"
      - "content/reviews/ai/**"
      - "docs/foundation/**"
      - "tools/foundation-validator/atlas_foundation_validator.py"
      - "tools/foundation-validator/phase1_ai_review.py"
      - "tools/foundation-validator/tests/test_phase1_ai_review.py"
      - ".github/workflows/foundation.yml"
  pull_request:
    paths:
      - "content/canonical/**"
      - "content/translations/**"
      - "content/fixtures/**"
      - "content/reviews/ai/**"
      - "docs/foundation/**"
      - "tools/foundation-validator/atlas_foundation_validator.py"
      - "tools/foundation-validator/phase1_ai_review.py"
      - "tools/foundation-validator/tests/test_phase1_ai_review.py"
      - ".github/workflows/foundation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/foundation-validator/requirements.txt

      - name: Install validator dependencies
        run: python -m pip install -r tools/foundation-validator/requirements.txt

      - name: Enforce English-only authored corpus
        shell: bash
        run: |
          if [ -d content/translations ] && find content/translations -type f -print -quit | grep -q .; then
            echo "Active translated authored content is not allowed in the current phase."
            find content/translations -type f -print
            exit 1
          fi
          echo "english-only-authored-corpus=pass"

      - name: Run active AI review tests
        run: |
          python -m unittest discover \
            -s tools/foundation-validator/tests \
            -p 'test_phase1_ai_review.py' \
            -v

      - name: Validate canonical English content
        run: |
          python tools/foundation-validator/atlas_foundation_validator.py validate \
            content/canonical

      - name: Validate comprehensive AI review
        run: |
          python tools/foundation-validator/phase1_ai_review.py \
            content/reviews/ai/feedback-delayed-comprehensive.json \
            --canonical-root content/canonical

      - name: Validate migration fixtures
        run: |
          python tools/foundation-validator/atlas_foundation_validator.py migration \
            content/fixtures/migrations/mechanical-0.1-to-0.2.json
          python tools/foundation-validator/atlas_foundation_validator.py migration \
            content/fixtures/migrations/semantic-claim-split.json

      - name: Validate identity fixture
        run: |
          python tools/foundation-validator/atlas_foundation_validator.py identity \
            content/fixtures/identity/alias-rename-federation.json

      - name: Verify synthetic stale translation state
        shell: bash
        run: |
          state="$(python tools/foundation-validator/atlas_foundation_validator.py translation-staleness \
            content/fixtures/translation/stale-source-revision.json)"
          printf 'translation-staleness=%s\n' "$state"
          test "$state" = "possibly-stale"
