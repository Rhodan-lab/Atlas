name: Phase 4 Workspace Browser Evidence

on:
  push:
    branches: [main]
    paths:
      - "apps/workspace-shell/**"
      - "content/canonical/**"
      - "content/fixtures/phase3_retrieval/**"
      - "content/fixtures/phase4_interaction/**"
      - "content/fixtures/phase4_workspace/**"
      - "docs/phase-4/**"
      - "tools/phase2_kernel/**"
      - "tools/phase3_retrieval/**"
      - "tools/phase4_workspace/**"
      - "tools/phase4_workspace_browser/**"
      - ".github/workflows/phase4-workspace-browser-evidence.yml"
  pull_request:
    paths:
      - "apps/workspace-shell/**"
      - "content/canonical/**"
      - "content/fixtures/phase3_retrieval/**"
      - "content/fixtures/phase4_interaction/**"
      - "content/fixtures/phase4_workspace/**"
      - "docs/phase-4/**"
      - "tools/phase2_kernel/**"
      - "tools/phase3_retrieval/**"
      - "tools/phase4_workspace/**"
      - "tools/phase4_workspace_browser/**"
      - ".github/workflows/phase4-workspace-browser-evidence.yml"

permissions:
  contents: read

jobs:
  browser-evidence:
    name: Pinned Chromium workspace evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/foundation-validator/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/phase4_workspace_browser/package-lock.json

      - name: Install pinned Python dependencies
        run: python -m pip install -r tools/foundation-validator/requirements.txt

      - name: Install locked Playwright graph
        working-directory: tools/phase4_workspace_browser
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install pinned Chromium and Linux dependencies
        working-directory: tools/phase4_workspace_browser
        run: npx playwright install chromium --with-deps

      - name: Check browser evidence source
        working-directory: tools/phase4_workspace_browser
        run: npm run check

      - name: Run accepted workspace shell tests
        run: python -m unittest tools.phase4_workspace.tests.test_shell -v

      - name: Build deterministic local workspace package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf phase4-workspace-shell
          mkdir -p phase4-workspace-shell
          cp apps/workspace-shell/index.html phase4-workspace-shell/index.html
          cp apps/workspace-shell/styles.css phase4-workspace-shell/styles.css
          cp apps/workspace-shell/app.js phase4-workspace-shell/app.js
          cp apps/workspace-shell/README.md phase4-workspace-shell/README.md
          python -m tools.phase4_workspace.build_shell \
            --output-dir phase4-workspace-shell \
            --report-output phase4-workspace-shell-report.json
          sha256sum \
            phase4-workspace-shell/index.html \
            phase4-workspace-shell/styles.css \
            phase4-workspace-shell/app.js \
            phase4-workspace-shell/data/workspace-shell-data.json \
            phase4-workspace-shell/data/workspace-export.json \
            phase4-workspace-shell/data/workspace-manifest.json \
            phase4-workspace-shell-report.json \
            | tee phase4-workspace-static-sha256.txt

      - name: Start isolated loopback server
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8768 --bind 127.0.0.1 --directory phase4-workspace-shell >phase4-workspace-browser-server.log 2>&1 &
          echo $! > phase4-workspace-browser-server.pid
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8768/ >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat phase4-workspace-browser-server.log
          exit 1

      - name: Generate browser evidence twice
        working-directory: tools/phase4_workspace_browser
        env:
          CI: "true"
        shell: bash
        run: |
          set -o pipefail
          npm run evidence -- \
            --base-url http://127.0.0.1:8768 \
            --repo-root "${{ github.workspace }}" \
            --shell-dir "${{ github.workspace }}/phase4-workspace-shell" \
            --output-dir "${{ github.workspace }}/phase4-workspace-browser-a" \
            2>&1 | tee "${{ github.workspace }}/phase4-workspace-browser-a.log"
          npm run evidence -- \
            --base-url http://127.0.0.1:8768 \
            --repo-root "${{ github.workspace }}" \
            --shell-dir "${{ github.workspace }}/phase4-workspace-shell" \
            --output-dir "${{ github.workspace }}/phase4-workspace-browser-b" \
            2>&1 | tee "${{ github.workspace }}/phase4-workspace-browser-b.log"

      - name: Verify repeated-run byte identity
        run: diff -ru phase4-workspace-browser-a phase4-workspace-browser-b

      - name: Validate browser evidence independently
        run: |
          python -m tools.phase4_workspace_browser.validate phase4-workspace-browser-a | tee phase4-workspace-browser-validation.json
          python -m tools.phase4_workspace_browser.validate phase4-workspace-browser-b >/dev/null

      - name: Run resealed tamper tests
        env:
          ATLAS_WORKSPACE_BROWSER_EVIDENCE_DIR: phase4-workspace-browser-a
        run: python -m unittest tools.phase4_workspace_browser.tests.test_validate -v

      - name: Verify pinned workspace browser baseline
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          baseline_path = Path('content/fixtures/phase4_workspace/workspace-browser-baseline.json')
          baseline = json.loads(baseline_path.read_bytes())
          root = Path('phase4-workspace-browser-a')

          assert baseline['contract'] == 'atlas-phase4-workspace-browser-baseline/0.1'
          assert baseline['phase'] == 4
          assert baseline['workstream'] == 3
          assert baseline['slice'] == 2
          assert baseline['state'] == 'workspace-browser-candidate'
          assert baseline['repeated_run_substantive_artifacts_byte_identical'] is True

          records = {}
          for name, expected in baseline['evidence'].items():
              path = root / expected['file']
              payload = path.read_bytes()
              record = json.loads(payload)
              assert len(payload) == expected['artifact']['bytes'], name
              assert hashlib.sha256(payload).hexdigest() == expected['artifact']['sha256'], name
              assert record['contract'] == expected['contract'], name
              assert record['report_digest'] == expected['report_digest'], name
              records[name] = record

          validation_path = Path(baseline['validation']['file'])
          validation_bytes = validation_path.read_bytes()
          validation = json.loads(validation_bytes)
          assert len(validation_bytes) == baseline['validation']['artifact']['bytes']
          assert hashlib.sha256(validation_bytes).hexdigest() == baseline['validation']['artifact']['sha256']
          assert validation['contract'] == baseline['validation']['contract']
          assert validation['decision'] == baseline['validation']['decision']
          assert validation['report_digest'] == baseline['validation']['report_digest']

          report = records['report']
          manifest = records['manifest']
          assert report['engine_name'] == baseline['engine']['name']
          assert report['engine_version'] == baseline['engine']['version']
          assert report['playwright_version'] == baseline['engine']['playwright_version']
          assert manifest['engine_name'] == baseline['engine']['name']
          assert manifest['engine_version'] == baseline['engine']['version']
          assert manifest['playwright_version'] == baseline['engine']['playwright_version']

          count_fields = {
              'routes': 'route_count',
              'keyboard_routes': 'keyboard_route_count',
              'entries': 'entry_count',
              'candidates': 'candidate_count',
              'principia_references': 'principia_reference_count',
              'warnings': 'warning_count',
              'viewports': 'viewport_count',
              'external_requests': 'external_request_count',
          }
          for baseline_name, report_name in count_fields.items():
              assert report[report_name] == baseline['counts'][baseline_name], baseline_name

          for claim, expected in baseline['claims'].items():
              assert report[claim] == expected, claim
          for field, expected in baseline['authority'].items():
              if field == 'browser_state_authority':
                  assert records['workflow'][field] == expected
              else:
                  assert report[field] == expected, field

          export_path = Path('phase4-workspace-shell/data/workspace-export.json')
          manifest_path = Path('phase4-workspace-shell/data/workspace-manifest.json')
          for name, path in [('export', export_path), ('manifest', manifest_path)]:
              expected = baseline['accepted_workspace'][name]
              payload = path.read_bytes()
              record = json.loads(payload)
              assert len(payload) == expected['artifact']['bytes']
              assert hashlib.sha256(payload).hexdigest() == expected['artifact']['sha256']
              assert record['contract'] == expected['contract']
              assert record['report_digest'] == expected['report_digest']

          shell = baseline['workspace_shell']
          index_bytes = Path('phase4-workspace-shell/index.html').read_bytes()
          assert len(index_bytes) == shell['accessibility_patch']['index_html']['bytes']
          assert hashlib.sha256(index_bytes).hexdigest() == shell['accessibility_patch']['index_html']['sha256']
          shell_data_bytes = Path('phase4-workspace-shell/data/workspace-shell-data.json').read_bytes()
          shell_data = json.loads(shell_data_bytes)
          assert len(shell_data_bytes) == shell['shell_data']['bytes']
          assert hashlib.sha256(shell_data_bytes).hexdigest() == shell['shell_data']['sha256']
          assert shell_data['build_digest'] == shell['shell_data']['build_digest']
          shell_report_bytes = Path('phase4-workspace-shell-report.json').read_bytes()
          shell_report = json.loads(shell_report_bytes)
          assert len(shell_report_bytes) == shell['build_report']['bytes']
          assert hashlib.sha256(shell_report_bytes).hexdigest() == shell['build_report']['sha256']
          assert shell_report['report_digest'] == shell['build_report']['report_digest']

          print('workspace-browser-baseline-sha256=' + hashlib.sha256(baseline_path.read_bytes()).hexdigest())
          print('workspace-browser-baseline=pinned-candidate; artifacts=6; validation=valid; external=0; mutation=false')
          PY

      - name: Verify browser evidence summary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('phase4-workspace-browser-a')
          report_path = root / 'workspace-browser-report.json'
          manifest_path = root / 'workspace-browser-manifest.json'
          report_bytes = report_path.read_bytes()
          manifest_bytes = manifest_path.read_bytes()
          report = json.loads(report_bytes)
          manifest = json.loads(manifest_bytes)

          assert report['contract'] == 'atlas-phase4-workspace-browser-report/0.1'
          assert report['state'] == 'workspace-browser-candidate'
          assert report['route_count'] == 13
          assert report['keyboard_route_count'] == 13
          assert report['entry_count'] == 5
          assert report['candidate_count'] == 2
          assert report['principia_reference_count'] == 1
          assert report['warning_count'] == 1
          assert report['viewport_count'] == 2
          assert report['external_request_count'] == 0
          assert report['accepted_export_sha256'] == '43f28738c4678dfcd0f7a3e4d31480f891112a8c9bd220929f8f32cd80edb98a'
          assert report['accepted_manifest_sha256'] == '8240d78b29f610cb7c566dfad50432473949c5a63b9de9c522ab28751d80fd09'
          assert report['local_download_byte_identical'] is True
          assert report['exact_entry_order_preserved'] is True
          assert report['decisions_read_only'] is True
          assert report['candidates_unresolved'] is True
          assert report['principia_status_separate'] is True
          assert report['warning_visibility_verified'] is True
          assert report['non_graph_workflow_complete'] is True
          assert report['visible_focus_verified'] is True
          assert report['reduced_motion_verified'] is True
          assert report['unknown_route_preserved'] is True
          assert report['missing_artifact_failure_explicit'] is True
          assert report['human_verified'] is False
          assert report['accessibility_certified'] is False
          assert report['canonical_mutation'] is False
          assert report['lifecycle_mutation'] is False
          assert report['review_mutation'] is False
          assert report['repository_mutation'] is False
          assert report['production_frontend_architecture_selected'] is False
          assert report['live_principia_dependency'] is False
          assert report['live'] is False
          assert manifest['engine_name'] == 'chromium'
          assert manifest['playwright_version'] == '1.62.0'

          print('workspace-browser-engine=chromium@' + report['engine_version'])
          print('workspace-browser-report-bytes=' + str(len(report_bytes)))
          print('workspace-browser-report-sha256=' + hashlib.sha256(report_bytes).hexdigest())
          print('workspace-browser-report-digest=' + report['report_digest'])
          print('workspace-browser-manifest-bytes=' + str(len(manifest_bytes)))
          print('workspace-browser-manifest-sha256=' + hashlib.sha256(manifest_bytes).hexdigest())
          print('workspace-browser-manifest-digest=' + manifest['report_digest'])
          print('workspace-browser=workspace-browser-candidate; routes=13; external=0; mutation=false')
          PY

      - name: Stop loopback server
        if: always()
        shell: bash
        run: |
          if [[ -f phase4-workspace-browser-server.pid ]]; then
            kill "$(cat phase4-workspace-browser-server.pid)" || true
          fi

      - name: Upload browser evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-workspace-browser-candidate
          path: |
            phase4-workspace-browser-a/
            phase4-workspace-browser-b/
            phase4-workspace-browser-validation.json
            phase4-workspace-shell/
            phase4-workspace-shell-report.json
            phase4-workspace-static-sha256.txt
            phase4-workspace-browser-server.log
            phase4-workspace-browser-a.log
            phase4-workspace-browser-b.log
            content/fixtures/phase4_workspace/workspace-browser-baseline.json
          if-no-files-found: error
          retention-days: 30
