name: Principia Evidence Simulation

on:
  pull_request:
    paths:
      - "content/canonical/**"
      - "content/reviews/ai/**"
      - "content/fixtures/phase2_bridge/*.json"
      - "docs/phase-2/evidence-simulation-v1.md"
      - "tools/phase2_kernel/evidence_bridge.py"
      - "tools/phase2_kernel/evidence_review.py"
      - "tools/phase2_kernel/evidence_registry.py"
      - "tools/phase2_kernel/evidence_impact.py"
      - "tools/phase2_kernel/evidence_simulation.py"
      - "tools/phase2_kernel/evidence_simulation_cli.py"
      - "tools/phase2_kernel/tests/test_evidence_simulation.py"
      - ".github/workflows/principia-evidence-simulation.yml"
  push:
    branches: [main]
    paths:
      - "content/canonical/**"
      - "content/reviews/ai/**"
      - "content/fixtures/phase2_bridge/*.json"
      - "docs/phase-2/evidence-simulation-v1.md"
      - "tools/phase2_kernel/evidence_bridge.py"
      - "tools/phase2_kernel/evidence_review.py"
      - "tools/phase2_kernel/evidence_registry.py"
      - "tools/phase2_kernel/evidence_impact.py"
      - "tools/phase2_kernel/evidence_simulation.py"
      - "tools/phase2_kernel/evidence_simulation_cli.py"
      - "tools/phase2_kernel/tests/test_evidence_simulation.py"
      - ".github/workflows/principia-evidence-simulation.yml"

permissions:
  contents: read

jobs:
  evidence-simulation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/foundation-validator/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r tools/foundation-validator/requirements.txt
      - name: Compile simulation modules
        run: |
          python -m py_compile \
            tools/phase2_kernel/evidence_simulation.py \
            tools/phase2_kernel/evidence_simulation_cli.py \
            tools/phase2_kernel/tests/test_evidence_simulation.py
      - name: Validate scenario JSON
        run: |
          python -m json.tool \
            content/fixtures/phase2_bridge/evidence-impact-scenario.none.v01.json \
            >/dev/null
      - name: Run evidence simulation tests
        run: |
          python -m unittest discover \
            -s tools/phase2_kernel/tests \
            -p 'test_evidence_simulation.py' \
            -v
      - name: Compile Atlas runtime
        run: python -m tools.phase2_kernel.cli compile --output /tmp/atlas-runtime.json
      - name: Build empty-scenario control twice
        run: |
          python -m tools.phase2_kernel.evidence_simulation_cli \
            --runtime /tmp/atlas-runtime.json \
            --output /tmp/evidence-simulation-a.json
          python -m tools.phase2_kernel.evidence_simulation_cli \
            --runtime /tmp/atlas-runtime.json \
            --output /tmp/evidence-simulation-b.json
          cmp /tmp/evidence-simulation-a.json /tmp/evidence-simulation-b.json
      - name: Verify current simulation decision and boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('/tmp/evidence-simulation-a.json').read_text(encoding='utf-8')
          )
          assert report['contract'] == 'atlas-principia-evidence-impact-simulation/0.1'
          assert report['scenario_contract'] == 'atlas-principia-evidence-impact-scenario/0.1'
          assert report['change_count'] == 0
          assert report['applied_changes'] == []
          assert report['baseline_affected_route_count'] == 0
          assert report['simulated_affected_route_count'] == 0
          assert report['newly_affected_route_count'] == 0
          assert report['escalated_route_count'] == 0
          assert report['newly_blocked_route_count'] == 0
          assert report['decision'] == 'simulation-clear'
          assert report['simulated_index']['decision'] == 'impact-index-clear'
          assert report['simulated_index']['route_count'] == 1
          assert report['simulated_index']['entity_count'] == 2
          assert report['simulated_index']['exact_reference_count'] == 2
          assert report['live'] is False
          assert report['status_inheritance'] == 'prohibited'
          assert report['automatic_snapshot_acceptance'] is False
          assert report['automatic_registry_update'] is False
          assert report['automatic_status_change'] is False
          assert report['automatic_release_action'] is False
          assert report['canonical_mutation'] is False
          assert report['repository_mutation'] is False
          assert report['principia_publication_status_granted'] is False
          assert report['learner_effectiveness_claimed'] is False
          print('principia-evidence-simulation=pass; changes=0; decision=simulation-clear')
          PY
      - name: Upload deterministic simulation report
        uses: actions/upload-artifact@v4
        with:
          name: principia-evidence-simulation-python-${{ matrix.python-version }}
          path: /tmp/evidence-simulation-a.json
          if-no-files-found: error
          retention-days: 30

  cross-version-identity:
    needs: evidence-simulation
    runs-on: ubuntu-latest
    steps:
      - name: Download Python 3.11 report
        uses: actions/download-artifact@v4
        with:
          name: principia-evidence-simulation-python-3.11
          path: /tmp/python-3.11
      - name: Download Python 3.13 report
        uses: actions/download-artifact@v4
        with:
          name: principia-evidence-simulation-python-3.13
          path: /tmp/python-3.13
      - name: Verify cross-version byte identity
        run: |
          cmp \
            /tmp/python-3.11/evidence-simulation-a.json \
            /tmp/python-3.13/evidence-simulation-a.json
          echo "principia-evidence-simulation-cross-version=byte-identical"
