name: Phase 3 Lexical Baseline

on:
  push:
    branches: [main]
    paths:
      - "content/canonical/**"
      - "content/fixtures/phase3_retrieval/**"
      - "docs/phase-3/**"
      - "tools/phase3_retrieval/**"
      - ".github/workflows/phase3-lexical-baseline.yml"
  pull_request:
    paths:
      - "content/canonical/**"
      - "content/fixtures/phase3_retrieval/**"
      - "docs/phase-3/**"
      - "tools/phase3_retrieval/**"
      - ".github/workflows/phase3-lexical-baseline.yml"

permissions:
  contents: read

jobs:
  lexical-baseline:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/foundation-validator/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r tools/foundation-validator/requirements.txt

      - name: Run lexical baseline tests
        run: python -m unittest tools.phase3_retrieval.tests.test_lexical -v

      - name: Generate lexical index, results, metrics, and report
        run: |
          python -m tools.phase3_retrieval.lexical \
            --query-set content/fixtures/phase3_retrieval/reference-query-set.v01.json \
            --cutoff 5 \
            --limit 10 \
            --index-output phase3-lexical-index.json \
            --result-output phase3-lexical-results.json \
            --metric-output phase3-lexical-metrics.json \
            --report-output phase3-lexical-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          index = json.loads(Path('phase3-lexical-index.json').read_text(encoding='utf-8'))
          results = json.loads(Path('phase3-lexical-results.json').read_text(encoding='utf-8'))
          metrics = json.loads(Path('phase3-lexical-metrics.json').read_text(encoding='utf-8'))
          report = json.loads(Path('phase3-lexical-report.json').read_text(encoding='utf-8'))

          assert index['contract'] == 'atlas-lexical-index/0.1'
          assert index['entity_count'] == 34
          assert index['replaceable'] is True
          assert index['canonical_mutation'] is False
          assert index['live'] is False
          assert len(index['build_digest']) == 64
          assert index['tokenizer']['stemming'] is False
          assert index['tokenizer']['query_expansion'] is False
          assert index['scoring']['algorithm'] == 'BM25F'
          assert index['scoring']['tie_break'] == 'exact-key-ascending'

          assert results['contract'] == 'atlas-retrieval-result-set/0.1'
          assert results['query_set_id'] == 'retrieval-query-set:phase3-reference-en-v1'
          assert results['query_set_version'] == 1
          assert len(results['responses']) == 13
          assert results['advisory_only'] is True
          assert results['live'] is False
          assert results['repository_mutation'] is False

          assert metrics['contract'] == 'atlas-retrieval-metric-report/0.1'
          assert metrics['cutoff'] == 5
          assert metrics['evaluated_ranked_queries'] == 12
          assert metrics['expected_error_queries'] == 1
          assert metrics['metrics']['unavailable_revision_rate'] == 1.0
          assert all(0.0 <= value <= 1.0 for value in metrics['metrics'].values())

          assert report['contract'] == 'atlas-lexical-baseline-report/0.1'
          assert report['decision'] == 'lexical-baseline-candidate'
          assert report['entity_count'] == 34
          assert report['query_count'] == 13
          assert report['deterministic_index'] is True
          assert report['rebuild_verified'] is True
          assert report['replaceable'] is True
          assert report['external_services'] is False
          assert report['embeddings'] is False
          assert report['vector_database'] is False
          assert report['judgment_specific_tuning'] is False
          assert report['quality_claim'] == 'bounded-reference-fixture-only'
          assert report['advisory_only'] is True
          assert report['live'] is False
          assert report['repository_mutation'] is False

          print('lexical-build-digest=' + index['build_digest'])
          print('lexical-result-set-sha256=' + metrics['result_set_sha256'])
          print('lexical-tie-count=' + str(metrics['tie_count']))
          print('lexical-metrics=' + json.dumps(metrics['metrics'], sort_keys=True, separators=(',', ':')))
          print('phase3-lexical=pass; entities=34; queries=13; cutoff=5; replaceable=true; embeddings=false; live=false')
          PY

      - name: Upload lexical baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase3-lexical-baseline-python-${{ matrix.python-version }}
          path: |
            phase3-lexical-index.json
            phase3-lexical-results.json
            phase3-lexical-metrics.json
            phase3-lexical-report.json
          if-no-files-found: error
          retention-days: 30
