name: Bootstrap Atlas

on:
  push:
    branches: [main]
    paths:
      - ".atlas-bootstrap/part-*"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reassemble and verify project archive
        shell: bash
        run: |
          set -euo pipefail
          cat .atlas-bootstrap/part-* > /tmp/atlas-project.tar.gz.b64
          printf '%s  %s\n' '90aefb729298af3692fc7d0513bc33f86f266e548099e6c0b80902c1681771ae' /tmp/atlas-project.tar.gz.b64 | sha256sum -c -
          base64 --decode /tmp/atlas-project.tar.gz.b64 > /tmp/atlas-project.tar.gz
          printf '%s  %s\n' '9ad404519b98e4db3e413cacc3374826b8e935460058285bd7e36e3ce44badc7' /tmp/atlas-project.tar.gz | sha256sum -c -

      - name: Expand Atlas source tree
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/atlas-project.tar.gz -C .
          rm -rf .atlas-bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit polyglot foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build polyglot Atlas foundation"
          git push
