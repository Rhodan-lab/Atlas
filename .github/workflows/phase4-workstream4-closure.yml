name: Phase 4 Workstream 4 Closure

on:
  push:
    branches: [main]
    paths:
      - "content/fixtures/phase4_workspace_generalization/**"
      - "content/fixtures/phase4_workspace_reader_reuse/**"
      - "content/fixtures/phase4_workspace_reader_browser/**"
      - "content/fixtures/phase4_workstream4_completion/**"
      - "docs/phase-4/**"
      - "tools/phase2_kernel/**"
      - "tools/phase4_workstream4_completion/**"
      - ".github/workflows/phase4-workstream4-closure.yml"
  pull_request:
    paths:
      - "content/fixtures/phase4_workspace_generalization/**"
      - "content/fixtures/phase4_workspace_reader_reuse/**"
      - "content/fixtures/phase4_workspace_reader_browser/**"
      - "content/fixtures/phase4_workstream4_completion/**"
      - "docs/phase-4/**"
      - "tools/phase2_kernel/**"
      - "tools/phase4_workstream4_completion/**"
      - ".github/workflows/phase4-workstream4-closure.yml"

permissions:
  contents: read

jobs:
  closure:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/foundation-validator/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r tools/foundation-validator/requirements.txt

      - name: Run Workstream 4 closure tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tools.phase4_workstream4_completion.tests.test_completion -v \
            2>&1 | tee phase4-workstream4-closure-tests.txt

      - name: Build completion evidence twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase4-workstream4-closure-a phase4-workstream4-closure-b
          python -m tools.phase4_workstream4_completion.cli \
            --report-output phase4-workstream4-closure-a/workstream4-completion-report.json \
            --validation-output phase4-workstream4-closure-a/workstream4-completion-validation.json \
            | tee phase4-workstream4-closure-a.log
          python -m tools.phase4_workstream4_completion.cli \
            --report-output phase4-workstream4-closure-b/workstream4-completion-report.json \
            --validation-output phase4-workstream4-closure-b/workstream4-completion-validation.json \
            | tee phase4-workstream4-closure-b.log

      - name: Verify repeated-run byte identity
        run: diff -ru phase4-workstream4-closure-a phase4-workstream4-closure-b

      - name: Independently validate completion evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from tools.phase4_workstream4_completion.closure import validate_completion_report

          report_path = Path('phase4-workstream4-closure-a/workstream4-completion-report.json')
          validation_path = Path('phase4-workstream4-closure-a/workstream4-completion-validation.json')
          report_bytes = report_path.read_bytes()
          validation_bytes = validation_path.read_bytes()
          report = json.loads(report_bytes)
          validation = json.loads(validation_bytes)
          rebuilt = validate_completion_report(report)

          assert rebuilt == validation
          assert report['contract'] == 'atlas-phase4-workstream4-completion-report/0.1'
          assert report['decision'] == 'proceed-phase4-completion-governance'
          assert len(report['exit_gates']) == 14
          assert all(report['exit_gates'].values())
          assert len(report['negative_cases']) == 20
          assert report['recommendation']['implementation_authorized'] is False
          assert report['recommendation']['phase4_closed_by_report'] is False
          assert report['recommendation']['phase5_authorized'] is False
          assert report['recommendation']['production_authorized'] is False
          assert report['recommendation']['deployment_authorized'] is False
          assert report['recommendation']['separate_governance_required'] is True
          assert report['authority']['canonical_mutation'] is False
          assert report['authority']['repository_mutation'] is False
          assert report['authority']['external_network_required'] is False
          assert report['authority']['human_verified'] is False
          assert report['authority']['accessibility_certified'] is False

          print('workstream4-completion-report-bytes=' + str(len(report_bytes)))
          print('workstream4-completion-report-sha256=' + hashlib.sha256(report_bytes).hexdigest())
          print('workstream4-completion-report-digest=' + report['report_digest'])
          print('workstream4-completion-validation-bytes=' + str(len(validation_bytes)))
          print('workstream4-completion-validation-sha256=' + hashlib.sha256(validation_bytes).hexdigest())
          print('workstream4-completion-validation-digest=' + validation['report_digest'])
          print('workstream4-completion=closure-candidate; gates=14; implementation-authorized=false')
          PY

      - name: Verify pinned completion baseline
        run: python -m tools.phase4_workstream4_completion.verify_baseline

      - name: Upload closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-workstream4-closure-python-${{ matrix.python-version }}
          path: |
            phase4-workstream4-closure-a/
            phase4-workstream4-closure-b/
            phase4-workstream4-closure-tests.txt
            phase4-workstream4-closure-a.log
            phase4-workstream4-closure-b.log
            content/fixtures/phase4_workstream4_completion/workstream4-completion-baseline.json
          if-no-files-found: error
          retention-days: 30

  cross-version:
    name: Cross-version byte identity
    needs: closure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phase4-workstream4-closure-python-3.11
          path: python-3.11
      - uses: actions/download-artifact@v4
        with:
          name: phase4-workstream4-closure-python-3.13
          path: python-3.13
      - name: Compare substantive artifacts
        run: |
          diff -u \
            python-3.11/phase4-workstream4-closure-a/workstream4-completion-report.json \
            python-3.13/phase4-workstream4-closure-a/workstream4-completion-report.json
          diff -u \
            python-3.11/phase4-workstream4-closure-a/workstream4-completion-validation.json \
            python-3.13/phase4-workstream4-closure-a/workstream4-completion-validation.json
          diff -u \
            python-3.11/content/fixtures/phase4_workstream4_completion/workstream4-completion-baseline.json \
            python-3.13/content/fixtures/phase4_workstream4_completion/workstream4-completion-baseline.json
          echo "phase4-workstream4-python-3.11-and-3.13=byte-identical"
