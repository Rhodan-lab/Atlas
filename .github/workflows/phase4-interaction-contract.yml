name: Phase 4 Interaction Contract

on:
  push:
    branches: [main]
    paths:
      - "content/canonical/**"
      - "content/fixtures/phase3_retrieval/**"
      - "content/fixtures/phase4_interaction/**"
      - "docs/phase-4/**"
      - "tools/phase2_kernel/**"
      - "tools/phase4_interaction/**"
      - ".github/workflows/phase4-interaction-contract.yml"
  pull_request:
    paths:
      - "content/canonical/**"
      - "content/fixtures/phase3_retrieval/**"
      - "content/fixtures/phase4_interaction/**"
      - "docs/phase-4/**"
      - "tools/phase2_kernel/**"
      - "tools/phase4_interaction/**"
      - ".github/workflows/phase4-interaction-contract.yml"

permissions:
  contents: read

jobs:
  interaction-contract:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/foundation-validator/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r tools/foundation-validator/requirements.txt

      - name: Run Phase 4 interaction tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tools.phase4_interaction.tests.test_contracts -v 2>&1 | tee phase4-interaction-tests.txt

      - name: Assemble fixtures and verify pinned evidence
        run: |
          python -m tools.phase4_interaction.fixtures \
            --manifest content/fixtures/phase4_interaction/reference-interactions.v01.json \
            --assembled-output phase4-interaction-fixtures.json \
            --report-output phase4-interaction-report.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          baseline = json.loads(Path('content/fixtures/phase4_interaction/interaction-contract-baseline.json').read_text(encoding='utf-8'))
          assembled_path = Path('phase4-interaction-fixtures.json')
          report_path = Path('phase4-interaction-report.json')
          assembled_bytes = assembled_path.read_bytes()
          report_bytes = report_path.read_bytes()
          assembled = json.loads(assembled_bytes)
          report = json.loads(report_bytes)

          assert baseline['contract'] == 'atlas-phase4-interaction-contract-baseline/0.1'
          assert assembled['contract'] == 'atlas-phase4-interaction-fixtures/0.1'
          assert report['contract'] == baseline['report_contract']
          assert report['mode'] == baseline['mode']
          assert report['state'] == baseline['state']
          assert report['decision'] == baseline['decision']
          assert report['source_digest'] == baseline['source_digest']
          assert report['entity_count'] == baseline['entity_count']
          assert report['fixture_id'] == baseline['fixture_id']
          assert report['fixture_version'] == baseline['fixture_version']
          assert report['fixture_sha256'] == baseline['fixture_semantic_sha256']
          assert report['report_digest'] == baseline['report_digest']
          assert report['counts'] == baseline['counts']
          assert report['workflow_kinds'] == baseline['workflow_kinds']
          assert [item['observed_error'] for item in report['negative_validations']] == baseline['negative_errors']
          assert report['exact_revision_preserved'] == baseline['exact_revision_preserved']
          assert report['authority_metadata_visible'] is True
          assert report['keyboard_paths_required'] == baseline['keyboard_paths_required']
          assert report['non_graph_paths_required'] == baseline['non_graph_paths_required']
          assert report['principia_status_separate'] == baseline['principia_status_separate']
          assert report['impact_warnings_required'] == baseline['impact_warnings_required']
          assert report['offline_capable'] == baseline['offline_capable']
          assert report['graph_visualization_optional'] == baseline['graph_visualization_optional']
          assert report['canonical_copy_authority'] == baseline['canonical_copy_authority']
          assert report['automatic_status_change'] == baseline['automatic_status_change']
          assert report['automatic_release_action'] == baseline['automatic_release_action']
          assert report['live_principia_dependency'] == baseline['live_principia_dependency']
          assert report['external_services'] == baseline['external_services']
          assert report['embeddings'] == baseline['embeddings']
          assert report['vector_database'] == baseline['vector_database']
          assert report['live'] == baseline['live']
          assert report['repository_mutation'] == baseline['repository_mutation']

          assembled_sha = hashlib.sha256(assembled_bytes).hexdigest()
          report_sha = hashlib.sha256(report_bytes).hexdigest()
          assert len(assembled_bytes) == baseline['assembled_fixture_artifact_bytes']
          assert assembled_sha == baseline['assembled_fixture_artifact_sha256']
          assert len(report_bytes) == baseline['report_artifact_bytes']
          assert report_sha == baseline['report_artifact_sha256']

          print('phase4-interaction-fixture-sha256=' + assembled_sha)
          print('phase4-interaction-report-sha256=' + report_sha)
          print('phase4-interaction-report-digest=' + report['report_digest'])
          print('phase4-interaction-counts=' + json.dumps(report['counts'], sort_keys=True, separators=(',', ':')))
          print('phase4-interaction=accepted-evidence-candidate; live=false; canonical-mutation=false; principia-status-separate=true')
          PY

      - name: Upload Phase 4 interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-interaction-python-${{ matrix.python-version }}
          path: |
            phase4-interaction-tests.txt
            phase4-interaction-fixtures.json
            phase4-interaction-report.json
          if-no-files-found: error
          retention-days: 30
