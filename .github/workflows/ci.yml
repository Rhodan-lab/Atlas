name: Atlas CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpp:
    name: C++ (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  python:
    name: Python ingestion
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: PYTHONPATH=tools/ingest-py python -m unittest discover -s tools/ingest-py/tests -v
      - name: Compile examples
        run: PYTHONPATH=tools/ingest-py python -m atlas_ingest build examples/notes --output data/generated.atlas

  rust:
    name: Rust search
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --manifest-path services/search-rs/Cargo.toml

  typescript:
    name: TypeScript API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test native TypeScript
        run: node --experimental-strip-types --test apps/api-ts/test/*.test.ts

  integration:
    name: End-to-end contracts
    runs-on: ubuntu-latest
    needs: [cpp, python, rust, typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native components
        run: ./scripts/build.sh
      - name: Run integration contract
        env:
          ATLAS_SEARCH_BIN: ${{ github.workspace }}/services/search-rs/target/release/atlas-search
        run: ./scripts/integration-check.sh
