name: Phase 2 Scale and Replay

on:
  push:
    branches: [main]
    paths:
      - "content/fixtures/phase2_scale/**"
      - "content/fixtures/phase2_protocol/**"
      - "docs/phase-2/**"
      - "tools/phase2_kernel/scale_replay.py"
      - "tools/phase2_kernel/tests/test_scale_replay.py"
      - "tools/phase2_kernel/__init__.py"
      - ".github/workflows/phase2-scale-replay.yml"
  pull_request:
    paths:
      - "content/fixtures/phase2_scale/**"
      - "content/fixtures/phase2_protocol/**"
      - "docs/phase-2/**"
      - "tools/phase2_kernel/scale_replay.py"
      - "tools/phase2_kernel/tests/test_scale_replay.py"
      - "tools/phase2_kernel/__init__.py"
      - ".github/workflows/phase2-scale-replay.yml"

permissions:
  contents: read

jobs:
  scale-replay:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/foundation-validator/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r tools/foundation-validator/requirements.txt

      - name: Run scale and replay tests
        run: python -m unittest tools.phase2_kernel.tests.test_scale_replay -v

      - name: Run scaled synthetic benchmark
        run: |
          python -m tools.phase2_kernel.scale_replay benchmark \
            --profile content/fixtures/phase2_scale/scaled-benchmark-profile.json \
            --enforce \
            --output phase2-scaled-benchmark.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('phase2-scaled-benchmark.json').read_text(encoding='utf-8'))
          assert report['contract'] == 'atlas-kernel-scaled-benchmark/0.1'
          assert report['mode'] == 'scale-replay-candidate'
          assert report['entity_count'] == 1026
          assert report['external_dependent_count'] == 256
          assert report['deterministic_runtime'] is True
          assert report['live'] is False
          assert report['mutation'] is False
          assert set(report['metrics']) == {
              'bridge_import_all',
              'compile',
              'exact_lookup',
              'impact_all',
              'provenance',
              'runtime_admission',
          }
          print('scaled-benchmark=pass; entities=1026; external-dependents=256; live=false')
          PY

      - name: Run multi-batch replay and recovery matrix
        run: |
          python -m tools.phase2_kernel.scale_replay replay-matrix \
            --output phase2-replay-matrix.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('phase2-replay-matrix.json').read_text(encoding='utf-8'))
          assert report['contract'] == 'atlas-principia-offline-replay-matrix/0.1'
          assert report['decision'] == 'verified-no-mutation'
          assert report['accepted_sequences'] == [1, 2]
          assert report['final_head_sequence'] == 2
          assert report['idempotent_replay'] is True
          assert len(report['rejected_cases']) == 5
          assert {case['error'] for case in report['rejected_cases']} == {
              'E-REPLAY-BATCH-ID',
              'E-REPLAY-CONFLICT',
              'E-REPLAY-LEDGER-DIGEST',
              'E-REPLAY-PREDECESSOR',
              'E-REPLAY-SKIPPED',
          }
          assert report['live'] is False
          assert report['automatic_status_change'] is False
          assert report['automatic_release_action'] is False
          assert report['repository_mutation'] is False
          print('replay-matrix=pass; accepted=2; idempotent=true; rejected=5; live=false')
          PY

      - name: Upload scale and replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-scale-replay-python-${{ matrix.python-version }}
          path: |
            phase2-scaled-benchmark.json
            phase2-replay-matrix.json
          if-no-files-found: error
          retention-days: 30
