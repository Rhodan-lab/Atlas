name: Phase 2 Knowledge Kernel

on:
  push:
    branches: [main]
    paths:
      - "content/canonical/**"
      - "content/fixtures/phase2_bridge/**"
      - "docs/phase-2/**"
      - "tools/phase2_kernel/**"
      - ".github/workflows/phase2-kernel.yml"
  pull_request:
    paths:
      - "content/canonical/**"
      - "content/fixtures/phase2_bridge/**"
      - "docs/phase-2/**"
      - "tools/phase2_kernel/**"
      - ".github/workflows/phase2-kernel.yml"

permissions:
  contents: read

jobs:
  kernel:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/foundation-validator/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r tools/foundation-validator/requirements.txt

      - name: Run Phase 2 kernel tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tools/phase2_kernel/tests -v 2>&1 \
            | tee phase2-kernel-tests.log

      - name: Upload kernel test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-kernel-tests-python-${{ matrix.python-version }}
          path: phase2-kernel-tests.log
          if-no-files-found: error
          retention-days: 14

      - name: Compile twice and verify deterministic output
        run: |
          python -m tools.phase2_kernel.cli compile --output /tmp/atlas-runtime-a.json
          python -m tools.phase2_kernel.cli compile --output /tmp/atlas-runtime-b.json
          cmp /tmp/atlas-runtime-a.json /tmp/atlas-runtime-b.json

      - name: Validate merged Principia PR 16 candidate
        run: |
          python -m tools.phase2_kernel.cli bridge-validate \
            content/fixtures/phase2_bridge/principia-feedback-pr16-v02.json \
            --runtime /tmp/atlas-runtime-a.json

      - name: Import candidate and verify lifecycle-aware impact
        run: |
          python -m tools.phase2_kernel.cli bridge-import \
            content/fixtures/phase2_bridge/principia-feedback-pr16-v02.json \
            --runtime /tmp/atlas-runtime-a.json \
            --output /tmp/principia-feedback.external-dependent.json
          python -m tools.phase2_kernel.cli impact \
            model:en:delayed-correction-recurrence@2 \
            --runtime /tmp/atlas-runtime-a.json \
            --external /tmp/principia-feedback.external-dependent.json \
            --output /tmp/model-impact.json
          python - <<'PY'
          import json
          from pathlib import Path

          imported = json.loads(Path('/tmp/principia-feedback.external-dependent.json').read_text(encoding='utf-8'))
          impact = json.loads(Path('/tmp/model-impact.json').read_text(encoding='utf-8'))
          assert imported['source_contract'] == 'principia-atlas-external-dependent/0.2'
          assert imported['legacy_id_index_verified'] is True
          assert impact['contract'] == 'atlas-lifecycle-impact-report/0.1'
          assert impact['external_dependents'][0]['id'] == 'principia:failure-pattern:feedback-instability'
          assert impact['external_dependents'][0]['declared_action'] == 'inspect'
          assert impact['external_dependents'][0]['effective_action'] == 'inspect'
          assert impact['automatic_status_change'] is False
          assert impact['automatic_release_action'] is False
          print('principia-v02-impact=pass; live=false; automatic-mutation=false')
          PY

      - name: Run representative kernel benchmark
        run: |
          python -m tools.phase2_kernel.benchmark \
            --fixture content/fixtures/phase2_bridge/principia-feedback-pr16-v02.json \
            --compile-iterations 3 \
            --operation-iterations 200 \
            --enforce \
            --output phase2-kernel-benchmark.json

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: phase2-kernel-benchmark-python-${{ matrix.python-version }}
          path: phase2-kernel-benchmark.json
          if-no-files-found: error
          retention-days: 30

      - name: Confirm unsafe bridge fixtures fail
        shell: bash
        run: |
          set -euo pipefail
          for fixture in \
            principia-feedback-legacy-id-only.json \
            principia-feedback-stale-revision.json \
            principia-feedback-status-inheritance.json
          do
            if python -m tools.phase2_kernel.cli bridge-validate \
              "content/fixtures/phase2_bridge/${fixture}" \
              --runtime /tmp/atlas-runtime-a.json
            then
              echo "Unsafe fixture unexpectedly passed: ${fixture}"
              exit 1
            fi
          done
          echo "unsafe-bridge-fixtures=rejected"
