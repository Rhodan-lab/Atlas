name: Phase 4 Reader Reuse Browser Evidence

on:
  push:
    branches: [main]
    paths:
      - "apps/workspace-shell/**"
      - "content/fixtures/phase4_workspace/**"
      - "content/fixtures/phase4_workspace_generalization/**"
      - "content/fixtures/phase4_workspace_reader_reuse/**"
      - "content/fixtures/phase4_workspace_reader_browser/**"
      - "docs/phase-4/workstream-4*"
      - "tools/phase2_kernel/**"
      - "tools/phase4_workspace/**"
      - "tools/phase4_workspace_browser/**"
      - "tools/phase4_workspace_generalization/**"
      - "tools/phase4_workspace_reader_reuse/**"
      - "tools/phase4_workspace_reader_browser/**"
      - ".github/workflows/phase4-reader-reuse-browser-evidence.yml"
  pull_request:
    paths:
      - "apps/workspace-shell/**"
      - "content/fixtures/phase4_workspace/**"
      - "content/fixtures/phase4_workspace_generalization/**"
      - "content/fixtures/phase4_workspace_reader_reuse/**"
      - "content/fixtures/phase4_workspace_reader_browser/**"
      - "docs/phase-4/workstream-4*"
      - "tools/phase2_kernel/**"
      - "tools/phase4_workspace/**"
      - "tools/phase4_workspace_browser/**"
      - "tools/phase4_workspace_generalization/**"
      - "tools/phase4_workspace_reader_reuse/**"
      - "tools/phase4_workspace_reader_browser/**"
      - ".github/workflows/phase4-reader-reuse-browser-evidence.yml"

permissions:
  contents: read

jobs:
  browser-evidence:
    name: Pinned Chromium reader-reuse evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/foundation-validator/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/phase4_workspace_reader_browser/package-lock.json

      - name: Install pinned Python dependencies
        run: python -m pip install -r tools/foundation-validator/requirements.txt

      - name: Install locked Playwright graph
        working-directory: tools/phase4_workspace_reader_browser
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install pinned Chromium and Linux dependencies
        working-directory: tools/phase4_workspace_reader_browser
        run: npx playwright install chromium --with-deps

      - name: Check browser evidence source
        working-directory: tools/phase4_workspace_reader_browser
        run: npm run check

      - name: Run accepted static package regressions
        run: |
          python -m unittest tools.phase4_workspace.tests.test_shell -v
          python -m unittest tools.phase4_workspace_generalization.tests.test_catalase -v
          python -m unittest tools.phase4_workspace_reader_reuse.tests.test_reader_reuse -v

      - name: Build and verify deterministic reader-reuse package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf phase4-reader-reuse-package
          python -m tools.phase4_workspace_reader_reuse.cli \
            --output-dir phase4-reader-reuse-package \
            | tee phase4-reader-reuse-package.log
          python -m tools.phase4_workspace_reader_reuse.verify_baseline \
            --package-dir phase4-reader-reuse-package

      - name: Start isolated loopback server
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8772 --bind 127.0.0.1 --directory phase4-reader-reuse-package \
            >phase4-reader-reuse-browser-server.log 2>&1 &
          echo $! > phase4-reader-reuse-browser-server.pid
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8772/ >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat phase4-reader-reuse-browser-server.log
          exit 1

      - name: Generate browser evidence twice
        working-directory: tools/phase4_workspace_reader_browser
        env:
          CI: "true"
        shell: bash
        run: |
          set -o pipefail
          npm run evidence -- \
            --base-url http://127.0.0.1:8772 \
            --repo-root "${{ github.workspace }}" \
            --package-dir "${{ github.workspace }}/phase4-reader-reuse-package" \
            --output-dir "${{ github.workspace }}/phase4-reader-reuse-browser-a" \
            2>&1 | tee "${{ github.workspace }}/phase4-reader-reuse-browser-a.log"
          npm run evidence -- \
            --base-url http://127.0.0.1:8772 \
            --repo-root "${{ github.workspace }}" \
            --package-dir "${{ github.workspace }}/phase4-reader-reuse-package" \
            --output-dir "${{ github.workspace }}/phase4-reader-reuse-browser-b" \
            2>&1 | tee "${{ github.workspace }}/phase4-reader-reuse-browser-b.log"

      - name: Verify repeated-run byte identity
        run: diff -ru phase4-reader-reuse-browser-a phase4-reader-reuse-browser-b

      - name: Validate browser evidence independently
        run: |
          python -m tools.phase4_workspace_reader_browser.validate phase4-reader-reuse-browser-a \
            | tee phase4-reader-reuse-browser-validation.json
          python -m tools.phase4_workspace_reader_browser.validate phase4-reader-reuse-browser-b >/dev/null

      - name: Run resealed tamper tests
        env:
          ATLAS_READER_REUSE_BROWSER_EVIDENCE_DIR: phase4-reader-reuse-browser-a
        run: python -m unittest tools.phase4_workspace_reader_browser.tests.test_validate -v

      - name: Verify pinned browser baseline when present
        shell: bash
        run: |
          if [ -f content/fixtures/phase4_workspace_reader_browser/reader-reuse-browser-baseline.json ]; then
            python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          baseline_path = Path('content/fixtures/phase4_workspace_reader_browser/reader-reuse-browser-baseline.json')
          baseline = json.loads(baseline_path.read_bytes())
          root = Path('phase4-reader-reuse-browser-a')

          assert baseline['contract'] == 'atlas-phase4-workspace-reader-reuse-browser-baseline/0.1'
          assert baseline['engine'] == {
              'name': 'chromium',
              'playwright_version': '1.62.0',
              'version': '151.0.7922.34',
          }
          assert baseline['repeated_run_substantive_artifacts_byte_identical'] is True
          for name, expected in baseline['evidence'].items():
              payload = (root / expected['file']).read_bytes()
              record = json.loads(payload)
              assert len(payload) == expected['artifact']['bytes'], name
              assert hashlib.sha256(payload).hexdigest() == expected['artifact']['sha256'], name
              assert record['contract'] == expected['contract'], name
              assert record['report_digest'] == expected['report_digest'], name
          validation_bytes = Path(baseline['validation']['file']).read_bytes()
          validation = json.loads(validation_bytes)
          assert len(validation_bytes) == baseline['validation']['artifact']['bytes']
          assert hashlib.sha256(validation_bytes).hexdigest() == baseline['validation']['artifact']['sha256']
          assert validation['contract'] == baseline['validation']['contract']
          assert validation['decision'] == baseline['validation']['decision']
          assert validation['report_digest'] == baseline['validation']['report_digest']
          report = json.loads((root / baseline['evidence']['report']['file']).read_bytes())
          assert report['decision'] == 'proceed-workstream4-closure-evaluation'
          assert report['implementation_authorized'] is False
          assert report['separate_governance_required'] is True
          assert len(report['exit_gates']) == 13 and all(report['exit_gates'].values())
          assert report['external_request_count'] == 0
          assert report['canonical_mutation'] is False
          assert report['repository_mutation'] is False
          print('reader-reuse-browser-baseline-sha256=' + hashlib.sha256(baseline_path.read_bytes()).hexdigest())
          print('reader-reuse-browser-baseline=pinned-candidate; external=0; mutation=false')
          PY
          else
            echo "exploratory-run=true; browser-baseline-not-yet-pinned"
          fi

      - name: Verify browser evidence summary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('phase4-reader-reuse-browser-a')
          report_path = root / 'reader-reuse-browser-report.json'
          report_bytes = report_path.read_bytes()
          report = json.loads(report_bytes)
          assert report['contract'] == 'atlas-phase4-workspace-reader-reuse-browser-report/0.1'
          assert report['state'] == 'reader-reuse-browser-candidate'
          assert report['decision'] == 'proceed-workstream4-closure-evaluation'
          assert report['implementation_authorized'] is False
          assert report['separate_governance_required'] is True
          assert report['selector_choice_count'] == 2
          assert report['route_count'] == 13
          assert report['keyboard_route_count'] == 13
          assert report['entry_count'] == 5
          assert report['candidate_count'] == 2
          assert report['principia_reference_count'] == 1
          assert report['warning_count'] == 1
          assert report['viewport_count'] == 2
          assert report['external_request_count'] == 0
          assert report['local_download_byte_identical'] is True
          assert report['recommender_regression_preserved'] is True
          assert report['selector_unknown_fixture_refused'] is True
          assert len(report['exit_gates']) == 13 and all(report['exit_gates'].values())
          assert report['human_verified'] is False
          assert report['accessibility_certified'] is False
          assert report['canonical_mutation'] is False
          assert report['repository_mutation'] is False
          print('reader-reuse-browser-engine=chromium@' + report['engine_version'])
          print('reader-reuse-browser-report-bytes=' + str(len(report_bytes)))
          print('reader-reuse-browser-report-sha256=' + hashlib.sha256(report_bytes).hexdigest())
          print('reader-reuse-browser-report-digest=' + report['report_digest'])
          print('reader-reuse-browser-exit-gates=' + str(len(report['exit_gates'])))
          print('reader-reuse-browser-decision=' + report['decision'])
          PY

      - name: Stop loopback server
        if: always()
        run: |
          if [ -f phase4-reader-reuse-browser-server.pid ]; then
            kill "$(cat phase4-reader-reuse-browser-server.pid)" || true
          fi

      - name: Upload browser evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-reader-reuse-browser-evidence
          path: |
            phase4-reader-reuse-browser-a/
            phase4-reader-reuse-browser-b/
            phase4-reader-reuse-browser-validation.json
            phase4-reader-reuse-browser-a.log
            phase4-reader-reuse-browser-b.log
            phase4-reader-reuse-package.log
            phase4-reader-reuse-browser-server.log
          if-no-files-found: error
          retention-days: 30
