name: Phase 1 AI Review

on:
  push:
    branches: [main]
    paths:
      - "PROJECT_STATE.md"
      - "content/canonical/feedback/**"
      - "content/reviews/ai/**"
      - "docs/phase-1/**"
      - "tools/foundation-validator/phase1_ai_review.py"
      - "tools/foundation-validator/tests/test_phase1_ai_review.py"
      - ".github/workflows/phase1-review.yml"
  pull_request:
    paths:
      - "PROJECT_STATE.md"
      - "content/canonical/feedback/**"
      - "content/reviews/ai/**"
      - "docs/phase-1/**"
      - "tools/foundation-validator/phase1_ai_review.py"
      - "tools/foundation-validator/tests/test_phase1_ai_review.py"
      - ".github/workflows/phase1-review.yml"

permissions:
  contents: read

jobs:
  ai-review:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/foundation-validator/requirements.txt

      - name: Install validator dependencies
        run: python -m pip install -r tools/foundation-validator/requirements.txt

      - name: Run AI review contract tests
        run: |
          python -m unittest discover \
            -s tools/foundation-validator/tests \
            -p 'test_phase1_ai_review.py' \
            -v

      - name: Validate corrected canonical content
        run: |
          python tools/foundation-validator/atlas_foundation_validator.py validate \
            content/canonical

      - name: Validate comprehensive delayed-feedback AI review
        run: |
          python tools/foundation-validator/phase1_ai_review.py \
            content/reviews/ai/feedback-delayed-comprehensive.json \
            --canonical-root content/canonical

      - name: Confirm AI-reviewed policy boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("content/reviews/ai/feedback-delayed-comprehensive.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["review_level"] == "ai-reviewed", payload
          assert payload["reviewer"]["kind"] == "ai", payload
          assert payload["reviewer"]["human_verified"] is False, payload
          assert payload["human_review_required"] is False, payload
          assert payload["overall_outcome"] == "pass", payload
          assert len(payload["entities"]) == 10, payload
          assert all(item["outcome"] == "pass" for item in payload["entities"]), payload
          print("phase1-ai-review=pass; entities=10; human-review-required=false")
          PY

      - name: Upload AI review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-ai-review-python-${{ matrix.python-version }}
          path: |
            content/reviews/ai/feedback-delayed-comprehensive.json
            docs/phase-1/ai-review-report.md
          if-no-files-found: error
          retention-days: 14
